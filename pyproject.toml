[tool.poetry]
name = "pro-particles"
version = "0.1.0"
description = "Interacting-particle sampler for Proper-Scoring-Rule (PrO) posteriors (NumPy-first)."
authors = ["Diogo Ribeiro <dfr@esmad.ipp.pt>"]
readme = "README.md"
packages = [{ include = "pro_particles", from = "src" }]
license = "MIT"
keywords = ["bayesian", "particle-methods", "scoring-rules", "posterior", "wasserstein"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[tool.poetry.urls]
"Homepage" = "https://github.com/diogoribeiro7/pro-particles"
"Repository" = "https://github.com/diogoribeiro7/pro-particles"
"Bug Tracker" = "https://github.com/diogoribeiro7/pro-particles/issues"

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
numpy = ">=1.24"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
ruff = ">=0.5"
mypy = ">=1.20.1"

[tool.ruff]
line-length = 100
target-version = "py310"
fix = true

[tool.mypy]
python_version = "3.10"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
no_implicit_optional = true
strict = false
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
markers = ["slow: marks tests as slow (deselect with '-m \"not slow\"')"]

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
pro-particles = "pro_particles.cli:main"
