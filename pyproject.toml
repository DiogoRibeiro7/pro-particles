[tool.poetry]
name = "pro-particles"
version = "0.1.0"
description = "Interacting-particle sampler for Proper-Scoring-Rule (PrO) posteriors (NumPy-first)."
authors = ["Diogo Ribeiro <you@example.com>"]
readme = "README.md"
packages = [{ include = "pro_particles", from = "src" }]
license = "MIT"

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
numpy = ">=1.24"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
ruff = ">=0.5"
mypy = ">=1.10"

[tool.ruff]
line-length = 100
target-version = "py310"
fix = true

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
strict = true

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"
